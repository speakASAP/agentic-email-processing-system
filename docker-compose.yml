# Agentic Email Processing System — default compose (single container)
# For blue/green use docker-compose.blue.yml and docker-compose.green.yml via deploy-smart.sh

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-email-processing-system
    ports:
      - "${PORT:-3374}:${PORT:-3374}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3374}
      - DOMAIN=${DOMAIN:-}
      - SERVICE_NAME=${SERVICE_NAME:-agentic-email-processing-system}
      - NGINX_NETWORK_NAME=${NGINX_NETWORK_NAME:-nginx-network}
      - LOGGING_SERVICE_URL=${LOGGING_SERVICE_URL:-http://logging-microservice:3367}
      - LOGGING_SERVICE_API_PATH=${LOGGING_SERVICE_API_PATH:-/api/logs}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-microservice:3380}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL:-}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-}
      - CLASSIFIER_CONFIDENCE_THRESHOLD=${CLASSIFIER_CONFIDENCE_THRESHOLD:-0.75}
      - AUTO_RESPOND_ENABLED=${AUTO_RESPOND_ENABLED:-false}
    networks:
      - nginx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PORT:-3374}/health"]
      interval: 10s
      timeout: 10s
      retries: 2

networks:
  nginx-network:
    external: true
