<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Triage Demo — Agentic Email Processing System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>Email Triage Demo</h1>
    <p class="subtitle">50 test emails · Ingest → Classify → Extract → Decide</p>
    <div class="actions">
      <button type="button" id="run-all" class="btn btn-primary">Run all 50 emails</button>
      <span id="poll-status" class="poll-status"></span>
    </div>
  </header>

  <main class="main">
    <section class="list-section" id="list-section">
      <h2>Emails</h2>
      <div class="filters">
        <label>Status <select id="filter-status"><option value="">All</option><option value="pending">Pending</option><option value="running">Running</option><option value="completed">Completed</option><option value="failed">Failed</option></select></label>
        <label>Category <select id="filter-category"><option value="">All</option></select></label>
      </div>
      <ul id="email-list" class="email-list"></ul>
    </section>

    <section class="detail-section" id="detail-section" hidden>
      <div class="detail-header">
        <button type="button" id="back" class="btn btn-secondary">← Back to list</button>
        <button type="button" id="run-one" class="btn btn-primary">Run triage</button>
      </div>
      <div id="detail-content" class="detail-content"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
