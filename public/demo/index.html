<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Triage Demo — Agentic Email Processing System</title>
  <!-- Critical inline CSS so page looks correct even if external CSS is blocked or mis-served -->
  <style>
    *{box-sizing:border-box}
    :root{--bg:#0b1118;--surface:#131b28;--border:#253047;--text:#f7fafc;--muted:#8b9ab4;--accent:#ff6b6b;--success:#3fb950;--warn:#f6c949;--error:#ff4b6a}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
    .header{padding:1.75rem 1.5rem 1.25rem;background:linear-gradient(120deg,rgba(11,23,40,.98),rgba(15,32,63,.98));border-bottom:1px solid var(--border);box-shadow:0 14px 40px rgba(0,0,0,.55)}
    .header h1{margin:0 0 .35rem 0;font-size:2rem;letter-spacing:.02em}
    .subtitle{margin:0 0 1rem 0;color:var(--muted);font-size:.95rem}
    .actions{display:flex;align-items:center;gap:.75rem}
    .poll-status{font-size:.8rem;color:var(--muted)}
    .btn{padding:.55rem 1.15rem;border:none;border-radius:6px;cursor:pointer;font-size:.875rem;font-weight:500}
    .btn-primary{background:var(--accent);color:#fff;box-shadow:0 10px 25px rgba(255,107,107,.35)}
    .btn-primary:hover{opacity:.95}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}
    .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
    .btn-secondary:hover{background:var(--border)}
    .main{padding:1.5rem;max-width:1200px;margin:0 auto}
    .list-section h2{margin:0 0 .75rem 0;font-size:1.1rem}
    .filters{margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:1.25rem;align-items:flex-start}
    .filter-group{display:flex;flex-direction:column;gap:.5rem}
    .filter-label{font-size:.875rem;font-weight:500;color:var(--muted)}
    .filter-buttons{display:flex;flex-wrap:wrap;gap:.5rem}
    .filter-btn{padding:.4rem .85rem;font-size:.8rem;font-weight:500;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer}
    .filter-btn:hover{background:var(--border);border-color:var(--muted)}
    .filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .email-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.5rem}
    .email-card{padding:.75rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.4)}
    .email-card:hover{border-color:var(--accent);transform:translateY(-1px)}
    .email-card .subject{font-weight:600;margin-bottom:.25rem}
    .email-card .preview{font-size:.8rem;color:var(--muted);max-height:2.5em;overflow:hidden;text-overflow:ellipsis}
    .email-card .meta{font-size:.75rem;color:var(--muted);display:flex;gap:.75rem;flex-wrap:wrap}
    .detail-section{margin-top:1rem}
    .detail-header{display:flex;gap:.75rem;margin-bottom:1rem}
    .detail-content{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem}
    .detail-email{margin-bottom:1.25rem}
    .detail-email .subject{font-size:1.1rem;font-weight:600}
    .detail-email .from{font-size:.85rem;color:var(--muted)}
    .detail-email .body{font-size:.9rem;white-space:pre-wrap;max-height:200px;overflow-y:auto;border:1px solid var(--border);padding:.75rem;border-radius:6px;background:var(--bg)}
    .stages{display:flex;flex-direction:column;gap:.75rem}
    .stage{border:1px solid var(--border);border-radius:6px;padding:.75rem 1rem;background:var(--bg)}
    .stage .name{font-weight:600;margin-bottom:.35rem;display:flex;align-items:center;gap:.5rem}
    .stage .name .badge{font-size:.7rem;padding:.2rem .5rem;border-radius:4px;font-weight:500}
    .stage .name .badge.pending{background:var(--surface);color:var(--muted)}
    .stage .name .badge.running{background:var(--warn);color:#000}
    .stage .name .badge.success{background:var(--success);color:#000}
    .stage .name .badge.failed{background:var(--error);color:#fff}
    .final{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}
    .final .explanation{font-weight:500;margin-bottom:.5rem;color:var(--accent)}
    .final .category{font-weight:600}
    .final .action,.final .escalation{margin-top:.25rem}
    .empty{color:var(--muted);font-style:italic}
    .modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
    .modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7)}
    .modal-box{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border)}
    .modal-header h3{margin:0;font-size:1.15rem}
    .modal-close{background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer;line-height:1;padding:0 .25rem}
    .modal-close:hover{color:var(--text)}
    .modal-body{padding:1.25rem}
    .modal-hint{color:var(--muted);font-size:.9rem;margin:0 0 1rem 0}
    .email-pick-list{list-style:none;padding:0;margin:0;max-height:320px;overflow-y:auto}
    .email-pick-list li{padding:.6rem .75rem;border:1px solid var(--border);border-radius:6px;margin-bottom:.5rem;cursor:pointer;font-size:.9rem}
    .email-pick-list li:hover{background:var(--border);border-color:var(--accent)}
    .email-pick-list .pick-subject{font-weight:600}
    .email-pick-list .pick-id{font-size:.75rem;color:var(--muted)}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.35rem;color:var(--muted)}
    .form-input,.form-textarea{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:.9rem;font-family:inherit}
    .form-textarea{resize:vertical;min-height:120px}
    .modal-actions{display:flex;gap:.75rem;margin-top:1.25rem}
  </style>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <h1>Email Triage Demo</h1>
    <p class="subtitle">50 test emails · Ingest → Classify → Extract → Decide</p>
    <div class="actions">
      <button type="button" id="run-all" class="btn btn-primary">Run all 50 emails</button>
      <button type="button" id="edit-dataset" class="btn btn-secondary">Edit</button>
      <span id="poll-status" class="poll-status"></span>
    </div>
  </header>

  <!-- Modal: select email to edit then edit form -->
  <div id="edit-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="edit-modal-title">Edit sample email</h3>
        <button type="button" id="edit-modal-close" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div id="edit-step-select" class="modal-body">
        <p class="modal-hint">Select an email to edit for real-time testing.</p>
        <ul id="edit-email-pick-list" class="email-pick-list"></ul>
      </div>
      <div id="edit-step-form" class="modal-body" hidden>
        <input type="hidden" id="edit-message-id" value="">
        <div class="form-group">
          <label for="edit-subject">Subject</label>
          <input type="text" id="edit-subject" class="form-input">
        </div>
        <div class="form-group">
          <label for="edit-sender">From (sender)</label>
          <input type="text" id="edit-sender" class="form-input">
        </div>
        <div class="form-group">
          <label for="edit-body">Body (plain text)</label>
          <textarea id="edit-body" class="form-textarea" rows="8"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" id="edit-back" class="btn btn-secondary">← Back to list</button>
          <button type="button" id="edit-save" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <main class="main">
    <section class="list-section" id="list-section">
      <h2>Emails</h2>
      <div class="filters">
        <div class="filter-group">
          <span class="filter-label">Status</span>
          <div id="filter-status-btns" class="filter-buttons">
            <button type="button" class="filter-btn active" data-status="">All</button>
            <button type="button" class="filter-btn" data-status="pending">Pending</button>
            <button type="button" class="filter-btn" data-status="running">Running</button>
            <button type="button" class="filter-btn" data-status="completed">Completed</button>
            <button type="button" class="filter-btn" data-status="failed">Failed</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Category</span>
          <div id="filter-category-btns" class="filter-buttons">
            <button type="button" class="filter-btn active" data-category="">All</button>
          </div>
        </div>
      </div>
      <ul id="email-list" class="email-list"></ul>
    </section>

    <section class="detail-section" id="detail-section" hidden>
      <div class="detail-header">
        <button type="button" id="back" class="btn btn-secondary">← Back to list</button>
        <button type="button" id="run-one" class="btn btn-primary">Run triage</button>
      </div>
      <div id="detail-content" class="detail-content"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
