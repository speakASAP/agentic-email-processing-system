apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-email-processing-system-config
  namespace: statex-apps
  labels:
    app: agentic-email-processing-system
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "agentic-email-processing-system"
  DOMAIN: "aeps.alfares.cz"
  PORT: "3374"
  # Add environment variables from .env that are non-sensitive (no secrets, API keys, passwords)
  # Examples:
  # DATABASE_POOL_SIZE: "10"
  # LOG_LEVEL: "info"
  AUTH_SERVICE_URL: "http://auth-microservice.statex-apps.svc.cluster.local:3370"
  LOGGING_SERVICE_URL: "http://logging-microservice.statex-apps.svc.cluster.local:3367"
  DB_HOST: "db-server-postgres.statex-apps.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "dbadmin"
  DB_NAME: "agentic_email_processing_system"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"
  # TIMEOUT_MS: "30000"
