apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentic-email-processing-system
  namespace: statex-apps
  labels:
    app: agentic-email-processing-system
    managed-by: k8s-migration
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - aeps.alfares.cz
      secretName: agentic-email-processing-system-tls
  rules:
    - host: aeps.alfares.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentic-email-processing-system
                port:
                  number: 3374
