# aeps.alfares.cz — canonical frontend only (no long domain here to avoid duplicate server_name).
# Deploy script substitutes {{AEPS_UPSTREAM}} with agentic-email-processing-system-blue or -green
# and copies this to nginx-microservice conf.d as aeps.alfares.cz.conf (same naming pattern as other domain configs).
# Main domain aeps.alfares.cz is defined only in blue-green generated config.

# HTTP — aeps.alfares.cz -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aeps.alfares.cz;

    include /etc/nginx/includes/common-http-server-settings.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — aeps.alfares.cz (frontend only)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aeps.alfares.cz;

    client_max_body_size 100M;

    ssl_certificate /etc/nginx/certs/aeps.alfares.cz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/aeps.alfares.cz/privkey.pem;
    include /etc/nginx/includes/common-server-settings.conf;

    location / {
        proxy_pass http://{{AEPS_UPSTREAM}};
        include /etc/nginx/includes/common-proxy-settings.conf;
        limit_req zone=api burst=20 nodelay;
    }
}
