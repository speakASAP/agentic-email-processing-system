# Alias domain: aeps.alfares.cz -> same backend as agentic-email-processing-system.alfares.cz
# Deployed by scripts/deploy.sh. Uses same upstream (green = active traffic).
# Deploy as z-aeps.alfares.cz.conf so it loads after main domain config (upstream already defined).
# SSL: uses /etc/nginx/certs/aeps.alfares.cz/ (symlink to alfares.cz if wildcard cert).

# HTTP - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aeps.alfares.cz;

    include /etc/nginx/includes/common-http-server-settings.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - proxy to same backend as main domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aeps.alfares.cz;

    client_max_body_size 100M;

    ssl_certificate /etc/nginx/certs/aeps.alfares.cz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/aeps.alfares.cz/privkey.pem;
    include /etc/nginx/includes/common-server-settings.conf;

    location / {
        proxy_pass http://agentic-email-processing-system-green;
        include /etc/nginx/includes/common-proxy-settings.conf;
        limit_req zone=api burst=20 nodelay;
    }
}
