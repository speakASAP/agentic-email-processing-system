# aeps.alfares.cz — canonical frontend (green). Same approach as main domain: one config per color.
# Deploy script copies the config matching the active main-domain symlink (blue or green).
# Redirect: long domain -> https://aeps.alfares.cz. Frontend proxies to agentic-email-processing-system-green.

# HTTP — long domain -> canonical HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name agentic-email-processing-system.alfares.cz www.agentic-email-processing-system.alfares.cz;

    include /etc/nginx/includes/common-http-server-settings.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://aeps.alfares.cz$request_uri;
    }
}

# HTTPS — long domain -> canonical
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agentic-email-processing-system.alfares.cz www.agentic-email-processing-system.alfares.cz;

    ssl_certificate /etc/nginx/certs/agentic-email-processing-system.alfares.cz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/agentic-email-processing-system.alfares.cz/privkey.pem;
    include /etc/nginx/includes/common-server-settings.conf;

    location / {
        return 301 https://aeps.alfares.cz$request_uri;
    }
}

# HTTP — aeps.alfares.cz -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aeps.alfares.cz;

    include /etc/nginx/includes/common-http-server-settings.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — aeps.alfares.cz (frontend only, green upstream)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aeps.alfares.cz;

    client_max_body_size 100M;

    ssl_certificate /etc/nginx/certs/aeps.alfares.cz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/aeps.alfares.cz/privkey.pem;
    include /etc/nginx/includes/common-server-settings.conf;

    location / {
        proxy_pass http://agentic-email-processing-system-green;
        include /etc/nginx/includes/common-proxy-settings.conf;
        limit_req zone=api burst=20 nodelay;
    }
}
